<style>:root{--bg:#F7F1E6;--card:#FFFCF6;--ink:#1F1B16;--mut:#7A7166;--line:#EADFCC;--acc:#C8701E;--indigo:#2B2A52;--lav:#ECE9F6;--lavI:#3B3A73;--logic:#F3F1FA;
  --good:#2D7A52;--goodS:#E3F1E9;--bad:#AE3A2F;--badS:#F8E2DE;--warn:#8F6209;--warnS:#F4EAD0;
  --serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,-apple-system,'Noto Sans','Noto Sans Devanagari',sans-serif;--mono:JBM,ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.mut{color:var(--mut)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums} b{font-weight:600}
#app{max-width:720px;margin:0 auto;min-height:100%;padding-bottom:84px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--indigo);display:grid;place-items:center;flex:none}
.ttl{font:600 19px var(--sans)} .ttl.serif{font:500 23px/1.15 var(--serif)}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line);flex:none}
.ib svg{width:19px;height:19px}
.h1{font:500 24px/1.15 var(--serif);padding:14px 16px 2px}
.sub{font:400 13px/1.4 var(--sans);color:var(--mut);padding:0 16px 10px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin:0 16px 10px;box-shadow:0 0 0 1px var(--line)}
.who b{font:600 15.5px var(--sans)} .who small{display:block;font:400 12px var(--sans);color:var(--mut);margin-top:1px}
.pill{font:600 11px var(--sans);padding:4px 9px;border-radius:999px;background:var(--lav);color:var(--lavI);white-space:nowrap}
.tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.hs-scroll::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:600 13px var(--sans);padding:8px 13px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line);color:#4A4752;white-space:nowrap}
.tabs button.on{background:var(--indigo);color:#fff;box-shadow:none}
.chips{display:flex;gap:5px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips button{flex:none;font:600 12px var(--mono);padding:7px 10px;border-radius:8px;background:#EDEAE3;color:#5B5763;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff}
.pad{padding:0 16px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
.card.dark{background:var(--indigo);color:#fff;box-shadow:none}
.card.dark .lbl{color:#B9B7E0} .card.dark p,.card.dark small{color:#D8D7F0}
.card.hl{box-shadow:0 0 0 1.5px var(--bad)} .card.hlg{box-shadow:0 0 0 1.5px var(--good)} .card.hla{box-shadow:0 0 0 1.5px var(--acc);background:#FFF9F3}
.card h3{font:600 15.5px var(--sans);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card h4{font:600 16px/1.3 var(--sans);margin:5px 0}
.card p{font:400 13.4px/1.5 var(--sans);color:#35323C}
.lbl{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vc{font:600 11px var(--sans);padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.vc.g{background:var(--goodS);color:var(--good)} .vc.m{background:var(--warnS);color:var(--warn)} .vc.b{background:var(--badS);color:var(--bad)} .vc.n{background:#EFECE6;color:#55515D}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font:600 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 5px;border-bottom:1px solid #EFECE6;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.w{white-space:normal}
tr.tap td{cursor:pointer} tr.tap:active td{background:#F6F3EC}
.r{color:var(--bad);font:700 9px var(--sans);margin-left:2px;vertical-align:top}
.seg{display:inline-flex;background:#ECE8E0;border-radius:10px;padding:3px;gap:2px}
.seg button{font:600 12.5px var(--sans);padding:6px 11px;border-radius:8px;color:#5B5763}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segw{padding:0 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* charts */
.kchart{width:100%;display:block;max-width:440px;margin:0 auto}
.kchart .ln{stroke:#D9D4CB;stroke-width:1.3;fill:none}
.kchart .frame{stroke:#8E8A96;stroke-width:1.5;fill:#fff}
.kchart .sn{font:600 11.5px var(--mono);fill:#A29EA9}
.kchart .kp{fill:var(--ink);font-family:var(--sans)}
.kchart .pc{font-weight:700} .kchart .pd{font-weight:500;fill:#45424D}
.kchart .mo,.kchart .asc{fill:var(--acc)} .kchart .mo .pd,.kchart .asc .pd{fill:var(--acc)}
.kchart .rr{fill:var(--bad);font-weight:700}
.kchart .num{font:700 20px var(--mono);fill:var(--indigo)} .kchart .num.lo{fill:var(--bad)} .kchart .num.hi{fill:var(--good)}
.sc .cell{stroke:#D9D4CB;stroke-width:1.2;fill:#fff}
.sc .sgn{font:600 10px var(--mono);fill:#A29EA9}
.sc .t{font:600 12px var(--sans);fill:var(--ink)}
.sc .t.mo,.sc .t.asc{fill:var(--acc)}
.ctitle{font:600 13px var(--sans);text-align:center;margin:8px 0 2px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:rgba(246,244,239,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 0;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10.5px var(--sans);color:#8C8895;width:64px}
.nav button.on{color:var(--indigo);font-weight:600}
.nav svg{width:22px;height:22px}
/* dasha */
.dchips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.dchip{border-radius:10px;padding:7px 7px;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;gap:1px;min-width:0}
.dchip .k{font:600 8.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip b{font:700 13.5px var(--sans)} .dchip span:last-child{font:500 9.5px var(--mono);color:var(--mut);white-space:nowrap}
.drow{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);margin-bottom:6px;width:100%;text-align:left}
.drow.cur{box-shadow:0 0 0 1.5px var(--acc);background:#FFF9F3}
.drow.past{opacity:.55}
.drow .nm{font:700 14.5px var(--sans)} .drow .nm i{font-style:normal;color:#9A96A2;font-weight:500;font-size:12.5px}
.drow .du{font:600 11px var(--mono);color:var(--mut);text-align:right}
.drow .rg{grid-column:1/-1;font:500 11.5px var(--mono);color:#3E3B45}
.drow .sb{grid-column:1/-1;font:400 11.8px/1.35 var(--sans);color:var(--mut)}
.now{font:700 9.5px var(--sans);color:var(--good);background:var(--goodS);padding:2px 6px;border-radius:999px;margin-left:5px;vertical-align:2px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.crumbs button{font:600 12px var(--sans);padding:5px 9px;border-radius:8px;background:var(--lav);color:var(--lavI)}
.crumbs button:last-child{background:var(--indigo);color:#fff}
/* report */
.pc-row{display:grid;grid-template-columns:16px 1fr;gap:6px;font:400 13.2px/1.45 var(--sans);color:#35323C;margin-bottom:7px;text-align:left;width:100%}
.pc-row b{font-weight:600;color:var(--ink)}
.pc-row .ic{font:700 14px var(--sans);text-align:center}
.pc-row .ic.p{color:var(--good)} .pc-row .ic.c{color:var(--bad)} .pc-row .ic.i{color:var(--lavI)}
.why{margin:2px 0 9px 22px;padding:8px 10px;border-radius:10px;background:var(--logic);font:500 11.8px/1.55 var(--mono);color:var(--lavI)}
.why div+div{margin-top:3px}
.tl{display:grid;grid-template-columns:86px 1fr;gap:7px 10px;font-size:13px;line-height:1.42}
.tl .d{font:600 11.5px var(--mono);color:var(--acc);padding-top:2px}
.note{font:400 11.8px/1.45 var(--sans);color:var(--mut);margin-top:8px}
.logic{margin-top:8px;border-radius:12px;background:var(--logic);padding:10px 12px;display:grid;gap:6px}
.logic div{display:grid;grid-template-columns:18px 1fr;gap:6px;font:400 12.8px/1.45 var(--sans);color:#2E2D50}
.logic div i{font-style:normal;font:700 11px var(--mono);color:#5E5CA8;padding-top:2px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:13.2px}
.kv dt{color:var(--mut);font-weight:500} .kv dd{margin:0;font-weight:600} .kv dd small{display:block;font:400 11.8px/1.35 var(--sans);color:var(--mut)}
.prow2{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.prow2:first-child{border-top:0}
.pg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 12.5px var(--mono);color:#fff}
.prow2 b{font:600 14px var(--sans)} .prow2 small{display:block;font:400 12.2px/1.4 var(--sans);color:var(--mut);margin-top:1px}
.chog{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cg{border-radius:9px;padding:7px 9px;display:flex;justify-content:space-between;font:600 12.4px var(--sans)}
.cg span{font:500 11.2px var(--mono);opacity:.85}
.cg.g{background:var(--goodS);color:#1F5A3B} .cg.m{background:#EFECE6;color:#55515D} .cg.b{background:var(--badS);color:#8A2A21}
.cg.nowc{box-shadow:0 0 0 1.5px var(--ink)}

    if (AND && AND.http) { var id = 'h' + (++httpN); HTTP[id] = function (st, tx) { if (st === 0) rej(new Error(tx || 'Network error')); else res({ status: st, text: tx }); }; AND.http(id, method, url, JSON.stringify(headers || {}), body || ''); return; }

  });
}
/* Streaming POST (server-sent events). onData(jsonString) for each "data:" line; resolves {status, text(error body)} at the end */
var HTTPC = {};
window.__httpChunk = function (id, data) { var f = HTTPC[id]; if (f) f(data); };
function httpStream(url, headers, body, onData) {
  return new Promise(function (res, rej) {
    if (AND && AND.httpStream) {
      var id = 's' + (++httpN); HTTPC[id] = onData;
      HTTP[id] = function (st, tx) { delete HTTPC[id]; if (st === 0) rej(new Error(tx || 'Network error')); else res({ status: st, text: tx }); };
      AND.httpStream(id, url, JSON.stringify(headers || {}), body); return;
    }
    if (AND && AND.http) { /* old app shell without streaming: one shot */
      return http('POST', url.replace(':streamGenerateContent?alt=sse', ':generateContent'), headers, body).then(function (r) { if (r.status === 200) { onData(r.text); res({ status: 200, text: '' }); } else res(r); }, rej);
    }
    fetch(url, { method: 'POST', headers: headers, body: body }).then(function (r) {
      if (!r.ok || !r.body) return r.text().then(function (t) { res({ status: r.status, text: t }); });
      var rd = r.body.getReader(), dec = new TextDecoder(), buf = '';
      (function pump() { rd.read().then(function (x) {
        if (x.done) { if (buf.indexOf('data:') === 0) onData(buf.slice(5).trim()); return res({ status: 200, text: '' }); }
        buf += dec.decode(x.value, { stream: true }); var lines = buf.split(/\r?\n/); buf = lines.pop();
        lines.forEach(function (l) { if (l.indexOf('data:') === 0) onData(l.slice(5).trim()); }); pump();
      }, rej); })();
    }).catch(rej);
  });
}

  h += '<div class="card"><h3>Your data</h3><p style="font-size:12.8px;margin-bottom:10px">' + DB.people.length + ' kundlis are stored only on this phone. Make a backup file before changing phones.</p><div class="grid2"><button class="btn" data-act="backup">Backup</button><button class="btn sec" data-act="restore">Restore</button></div></div>';
  h += '<div class="card"><h3>Accuracy</h3><p style="font-size:12.8px">Planet and lagna positions are checked against Swiss Ephemeris (the engine used by Jagannatha Hora and most professional software): planets within a few arc-seconds, lagna within arc-seconds for a correct birth time. Panchang ends, dashas and transits come from the same engine. Readings and remedies follow classical rules and show their logic; like any astrology, they are interpretations, not certainties.</p></div>';
  h += '<div class="card"><h3>About</h3><p style="font-size:12.8px">Trikaal ' + APP_VERSION + '. Parashari, KP, Tajik and Muhurat in one place, offline. Built for Mehul.</p><div class="grid2" style="margin-top:10px"><button class="btn sec" data-act="printNow">' + icon('print', 16) + 'Print / PDF</button><button class="btn sec" data-act="sampleData">Add sample</button></div></div>';
  return h + '</div>';
}
var APP_VERSION = '2.0';
INP.setGkey = function (el) { DB.settings.gkey = el.value.trim(); DB.settings.gnoPro = false; DB.settings.gbad = []; save(); };
CHG.setGfast = function (el) { DB.settings.gfast = el.value === '1'; save(); toast(DB.settings.gfast ? 'Fast answers on' : 'Deep answers on'); };
CHG.setGmodel = function (el) { DB.settings.gmodel = el.value; if (/-pro/.test(el.value)) DB.settings.gnoPro = false; save(); };
INP.setGmodelTxt = function (el) { if (el.value.trim()) { DB.settings.gmodel = el.value.trim(); save(); } };
function gModelOpts() {
  var list = (DB.settings.gmodels && DB.settings.gmodels.length ? DB.settings.gmodels : [GDEFAULT, 'gemini-3-flash-preview']).filter(function (n) { return gRank(n, 'flash') > 0; }).slice(0, 12), cur = DB.settings.gmodel || GDEFAULT;
  if (list.indexOf(cur) < 0) list = [cur].concat(list);
  var best = gBest(list, DB.settings.gnoPro ? 'flash' : 'pro');
  return list.map(function (n) { return [n, n + (n === best ? '  (best)' : '') + ((DB.settings.gbad || []).indexOf(n) >= 0 ? '  (no free quota)' : '')]; });
}
/* Test: list the key's models, then try them best-first until one actually answers; save that one */
ACT.testGkey = function () {
  if (!DB.settings.gkey) return toast('Paste your Gemini key first');
  toast('Checking which models your key can use…', 2500);
  var ping = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Reply with the single word OK.' }] }] }), busy = [];
  gListModels().then(function (list) {
    var want = DB.settings.gnoPro ? 'flash' : 'pro';
    var cands = list.filter(function (n) { return gRank(n, want) > 0; }).sort(function (a, b) { return gRank(b, want) - gRank(a, want); }).slice(0, 7);
    if (!cands.length) throw new Error('No Gemini text models are available for this key');
    var i = 0;
    function next() {
      if (i >= cands.length) { if (busy.length) { DB.settings.gmodel = busy[0]; save(); return busy[0] + ' (busy now, try again shortly)'; } throw new Error('None of your models have free quota. Check the key in Google AI Studio.'); }
      var m = cands[i++];
      return gCall(m, ping).then(function (x) {
        if (x.status === 200) { DB.settings.gmodel = m; save(); return m; }
        if (x.status === 429 && /limit: 0/i.test(x.msg)) { DB.settings.gbad = uniqA((DB.settings.gbad || []).concat([m])); if (/-pro/.test(m)) DB.settings.gnoPro = true; save(); }
        else if (gBusy(x)) busy.push(m);
        return next();
      });
    }
    return next();
  }).then(function (m) { toast('Gemini works ✓ using ' + m, 4000); if (parts()[0] === 'more') rerender(); })
    .catch(function (e) { toast('Test failed: ' + e.message, 5000); if (parts()[0] === 'more') rerender(); });
};
function resetCache() { CACHE = {}; }
CHG.setAyan = function (el) { DB.settings.ayan = el.value; save(); resetCache(); toast('Ayanamsa: ' + C.AYAN_INFO[el.value].name); };
CHG.setNode = function (el) { DB.settings.node = el.value; save(); resetCache(); };
CHG.setDyear = function (el) { DB.settings.dyear = +el.value; save(); resetCache(); };
CHG.setStyle = function (el) { DB.settings.style = el.value; U.style = null; save(); };
INP.setKey = function (el) { DB.settings.key = el.value.trim(); save(); };
CHG.setModel = function (el) { DB.settings.model = el.value; save(); };
ACT.toggleDeep = function (el) { DB.settings.deep = !DB.settings.deep; save(); el.classList.toggle('on', DB.settings.deep); };
ACT.testKey = function () {
  if (!DB.settings.key) return toast('Paste your API key first');
  toast('Testing…', 1200);
  http('POST', 'https://api.anthropic.com/v1/messages', { 'content-type': 'application/json', 'x-api-key': DB.settings.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, JSON.stringify({ model: DB.settings.model, max_tokens: 20, messages: [{ role: 'user', content: 'Reply with the single word OK.' }] }))
    .then(function (r) { if (r.status === 200) toast('Key works ✓'); else { var m = ''; try { m = JSON.parse(r.text).error.message; } catch (e) { } toast('Error ' + r.status + (m ? ': ' + m : ''), 4000); } })
    .catch(function (e) { toast('No connection: ' + e.message, 3500); });
};
ACT.backup = function () {
  var d = new Date(), name = 'trikaal-backup-' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + '.json';
  var data = JSON.parse(JSON.stringify(DB)); data.settings.key = ''; data.settings.gkey = ''; data.exported = d.toISOString();
  saveFile(name, 'application/json', JSON.stringify(data, null, 1));
};
ACT.restore = function () {
  openFile(function (text) {
    try {
      var d = JSON.parse(text); if (!d.people) throw new Error('Not a Trikaal backup');
      var ids = DB.people.map(function (p) { return p.id; }), added = 0;
      d.people.forEach(function (p) { var i = ids.indexOf(p.id); if (i >= 0) DB.people[i] = p; else { DB.people.push(p); added++; } });
      (d.remedies || []).forEach(function (r) { DB.remedies = DB.remedies || []; if (!DB.remedies.some(function (x) { return x.id === r.id; })) DB.remedies.push(r); });
      Object.keys(d.chats || {}).forEach(function (k) { if (!DB.chats[k]) DB.chats[k] = d.chats[k]; });
      if (!DB.settings.meId && d.settings && d.settings.meId) DB.settings.meId = d.settings.meId;
      save(); resetCache(); toast('Restored ' + d.people.length + ' kundlis (' + added + ' new)'); rerender();
    } catch (e) { toast('Could not restore: ' + e.message, 3500); }
  });
};
ACT.printNow = function () { printPage(); };
ACT.sampleData = function () {
  if (DB.people.some(function (p) { return p.id === 'sample1'; })) return toast('Sample already added');
  DB.people.push({ id: 'sample1', name: 'Rahul Shah (sample)', gender: 'M', date: '1990-07-04', time: '14:15:00', place: 'Delhi', lat: 28.6139, lon: 77.209, zone: 'Asia/Kolkata', tz: 5.5, notes: 'Sample chart for trying the app', events: [{ type: 'accident', date: '2026-07-15', time: '11:30' }], created: Date.now() });
  save(); toast('Sample kundli added'); go('people');
};

/* ---------- boot ---------- */
(function boot() {
  load(); applySettings();
  var t = $('#askIn');
  t.addEventListener('input', function () { t.style.height = ''; t.style.height = Math.min(120, t.scrollHeight) + 'px'; });
  t.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ACT.askSend(); } });
  window.trikaalBack = function () { if ($('#scrim')) { closeSheet(); return 'true'; } var p = parts(); if (!p.length || ['astro', 'panchang', 'dasha', 'remedies', 'ai'].indexOf(p[0]) >= 0 && p.length < 2) return 'false'; history.back(); return 'true'; };
  try { scheduleAll(); } catch (e) { }
  render();
})();
</script>
