<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky date bar with view tabs (Today, Week, Month, Year, Chart, Guide); one column of panels below.
   Palette: moonlit slate ground, saffron as the single accent for "now", semantic green / amber / red for day quality. */
:root{
  --bg:#EDEFF4; --panel:#F9FAFC; --sunk:#E2E5EE; --ink:#161B2C; --muted:#586077; --line:#D1D5E1;
  --accent:#B5560A; --good:#1D774D; --good-soft:#DAEEE2; --warn:#8E6200; --warn-soft:#F4E8C7; --bad:#AD372B; --bad-soft:#F6DDD8;
  --display:"Rozha One","Iowan Old Style",Georgia,serif;
  --body:"Mukta","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --panel:#171B2C; --sunk:#21263A; --ink:#E6E8F0; --muted:#9BA1B6; --line:#2C3249;
    --accent:#F29A4A; --good:#5DCA92; --good-soft:#15301F; --warn:#E6BA50; --warn-soft:#332A10; --bad:#F2806F; --bad-soft:#3A1D1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1220; --panel:#171B2C; --sunk:#21263A; --ink:#E6E8F0; --muted:#9BA1B6; --line:#2C3249;
  --accent:#F29A4A; --good:#5DCA92; --good-soft:#15301F; --warn:#E6BA50; --warn-soft:#332A10; --bad:#F2806F; --bad-soft:#3A1D1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
ul{margin:0}

/* top bar + tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;line-height:1;margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:6px}
.datectl{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
input[type=date],input[type=time],input[type=text],input[type=number],select{font:500 16px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;min-width:0}
.todaybtn{font:600 14px var(--body);padding:8px 12px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer;min-height:40px}
.tabs{max-width:880px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 15px;font:600 14px var(--body);cursor:pointer;min-height:38px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.eyebrow{font:600 11.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;text-wrap:balance}
h3{font-size:16px;font-weight:700;line-height:1.3}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13.5px}
.lead{font-size:16.5px;max-width:64ch}
.stack{display:grid;gap:12px}

/* verdict */
.verdict{border-radius:var(--r);padding:18px 18px 16px;display:grid;gap:12px}
.verdict.push{background:var(--good-soft)} .verdict.steady{background:var(--warn-soft)} .verdict.backend{background:var(--bad-soft)}
.v-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.v-word{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,52px);line-height:.95}
.push .v-word{color:var(--good)} .steady .v-word{color:var(--warn)} .backend .v-word{color:var(--bad)}
.v-date{font:600 13px var(--mono);color:var(--muted);text-align:right}
.v-date b{display:block;font-family:var(--body);font-size:18px;color:var(--ink);font-weight:600}
.v-guide{font-size:17px;max-width:62ch}
.v-notes{display:grid;gap:4px;padding-left:18px}
.factors{display:flex;flex-wrap:wrap;gap:6px}
.fct{display:inline-flex;align-items:center;gap:6px;font:500 13.5px/1.3 var(--body);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.fct i{font-style:normal;font:600 12px var(--mono)}
.fct.pos i{color:var(--good)} .fct.neg i{color:var(--bad)} .fct.zero i{color:var(--muted)}
.windows{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.win{background:var(--panel);border-radius:10px;padding:10px 12px;display:grid;gap:2px;border:1px solid var(--line)}
.win .k{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase}
.win.go .k{color:var(--good)} .win.no .k{color:var(--bad)}
.win .t{font:600 16px var(--mono);font-variant-numeric:tabular-nums}
.win .s{font-size:13.5px;color:var(--muted)}

/* focus list */
.focus{display:grid;gap:10px}
.fo{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.fo:last-child{border-bottom:0;padding-bottom:0}
.fo .k{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.fo ul{padding-left:18px;display:grid;gap:4px}

/* grids, kv */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:14px;padding-top:1px}
dl.kv dd{margin:0;font-weight:600}
dl.kv dd small{display:block;font:500 12.5px var(--mono);color:var(--muted)}
.sig{display:grid;gap:10px}
.sig-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sig-row:last-child{border-bottom:0;padding-bottom:0}
.sig-row .n{font-weight:700}
.sig-row .d{grid-column:1/-1;font-size:14px;color:var(--muted)}
.tag{font:600 11.5px var(--mono);padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:start}
.tag.pos,.tag.push{background:var(--good-soft);color:var(--good)} .tag.neg,.tag.backend{background:var(--bad-soft);color:var(--bad)} .tag.zero{background:var(--sunk);color:var(--muted)} .tag.steady{background:var(--warn-soft);color:var(--warn)}

/* checklist */
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;font:500 15px/1.4 var(--body);cursor:pointer;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--good)}
.item:has(input:checked) span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}

/* horas */
.horas{display:grid;gap:2px;max-height:420px;overflow-y:auto;margin-inline:-4px;padding-inline:4px}
.hr{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.hr.now{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.hr .tm{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hr .pl{font-weight:600}
.hr .pl span{font-weight:500;color:var(--muted);margin-left:6px;font-size:14px}
.hr.night .pl{color:var(--muted)}
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13.5px var(--body);padding:6px 12px;border-radius:7px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* week */
.wrows{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.wrow:hover{border-color:var(--muted)}
.wrow.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wrow .dd{display:grid;justify-items:center;gap:0;line-height:1.1}
.wrow .dd b{font:600 22px var(--mono)}
.wrow .dd span{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wrow .mid{display:grid;gap:3px;min-width:0}
.wrow .mid .l1{font-weight:600}
.wrow .mid .l2{font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font:600 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.acc{color:var(--accent)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.pl-card{border-radius:10px;padding:12px;background:var(--sunk);display:grid;gap:2px}
.pl-card .k{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pl-card b{font-size:16px}
.pl-card span{font-size:13.5px;color:var(--muted)}

/* month calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font:600 11px var(--mono);color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cell{min-height:58px;border-radius:9px;border:1px solid transparent;padding:6px 6px 5px;display:grid;align-content:space-between;text-align:left;cursor:pointer;background:var(--sunk)}
.cell.push{background:var(--good-soft)} .cell.steady{background:var(--warn-soft)} .cell.backend{background:var(--bad-soft)}
.cell .n{font:600 15px var(--mono)}
.cell .f{font:600 9.5px var(--mono);color:var(--muted);letter-spacing:.02em;line-height:1.2;min-height:11px}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel{border-color:var(--ink)}
.cell.blank{background:transparent;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.push{background:var(--good)} .sw.steady{background:var(--warn)} .sw.backend{background:var(--bad)}

/* event list */
.evlist{display:grid;gap:0}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{font:600 12.5px var(--mono);color:var(--muted);line-height:1.4}
.ev .t b{display:block;font-weight:700}
.ev .t span{font-size:14px;color:var(--muted)}
.ev.pos .t b::after{content:" ↑";color:var(--good)} .ev.neg .t b::after{content:" ↓";color:var(--bad)}

/* year */
.mrows{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) 92px;gap:10px;align-items:center;cursor:pointer;background:none;border:0;padding:4px 0;text-align:left;width:100%}
.mrow .ml{font:600 13px var(--mono)}
.mbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.mbar i{display:block;height:100%}
.mbar .push{background:var(--good)} .mbar .steady{background:var(--warn)} .mbar .backend{background:var(--bad)}
.mrow .mc{font:500 12px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.mrow.cur .ml{color:var(--accent)}
.pcards{display:grid;gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.pcard.cur{border-color:var(--accent)}
.pcard .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pcard .hd b{font-size:17px}
.pcard .hd span{font:500 12.5px var(--mono);color:var(--muted)}
.pcard dl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;margin:0;font-size:14.5px}
.pcard dt{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.pcard dd{margin:0}

/* tables, charts */
.tbl-wrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:540px}
table.narrow{min-width:0}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal}
tr:last-child td{border-bottom:0}
.r{font:600 11px var(--mono);color:var(--bad);margin-left:4px}
.charts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.nchart{width:100%;max-width:340px;height:auto;display:block;margin-inline:auto}
.nchart .ln{stroke:var(--line);stroke-width:1.2;fill:none}
.nchart .frame{stroke:var(--muted);stroke-width:1.4;fill:var(--panel)}
.nchart .sn{font:500 10px var(--mono);fill:var(--muted)}
.nchart .pl{font:600 12.5px var(--body);fill:var(--ink)}
.nchart .pl.mo{fill:var(--accent)}
.nchart .asc{font:600 9.5px var(--mono);fill:var(--accent);letter-spacing:.05em}
.status{display:grid;gap:10px}
.st{border-radius:10px;padding:12px 14px;background:var(--sunk);display:grid;gap:2px}
.st b{font-size:15.5px} .st span{font-size:14px;color:var(--muted)}
.dnow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.dchip{border-radius:10px;padding:10px 12px;background:var(--sunk);display:grid;gap:1px;min-width:0}
.dchip .k{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dchip .v{font-weight:700;font-size:16px}
.dchip .e{font:500 12px var(--mono);color:var(--muted)}
.mds{display:grid;gap:4px}
.md{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.md > button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;background:none;border:0;padding:10px 12px;cursor:pointer;text-align:left}
.md.cur{border-color:var(--accent)}
.md .nm{font-weight:700}
.md .rng{font:500 12.5px var(--mono);color:var(--muted);white-space:nowrap}
.ads{display:grid;padding:0 12px 10px}
.ad{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:14.5px}
.ad.cur{color:var(--accent);font-weight:700}
.ad .rng{font:500 12.5px var(--mono);color:var(--muted)}

/* guide */
.gsec{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{border-radius:10px;padding:12px 14px;background:var(--sunk)}
.box h3{margin-bottom:6px;font-size:14px;font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase}
.box.g h3{color:var(--good)} .box.y h3{color:var(--warn)} .box.b h3{color:var(--bad)}
.box ul{padding-left:18px;display:grid;gap:3px;font-size:14.5px}
.note{font-size:13.5px;color:var(--muted)}
details.more > summary{cursor:pointer;font:600 14px var(--body);list-style:none}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+ ";color:var(--accent)}
details.more[open] > summary::before{content:"– "}

/* settings */
details.settings > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.settings > summary::-webkit-details-marker{display:none}
details.settings > summary::after{content:"Edit";font:600 13px var(--body);padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
details.settings[open] > summary::after{content:"Close"}
.form{display:grid;gap:16px;margin-top:16px}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fs legend{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select{width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:500;color:var(--ink);grid-column:1/-1}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--body);padding:10px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.saved{font-size:14px;color:var(--good)}
.foot{font-size:13px;color:var(--muted);max-width:70ch}
.boot{padding:24px 0;color:var(--muted)}

@media (max-width:640px){
  .grid2,.charts2{grid-template-columns:1fr}
  .brand small{display:none}
  .hr{grid-template-columns:92px minmax(0,1fr) auto}
  .fo{grid-template-columns:1fr;gap:4px}
  .ev{grid-template-columns:80px minmax(0,1fr)}
  .cell{min-height:50px;padding:5px 4px 4px}
  .cell .n{font-size:13px}
  .cell .f{font-size:8.5px}
  .mrow{grid-template-columns:36px minmax(0,1fr) 74px}
}
/* live + ask */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.live{display:grid;gap:10px}
.lv-row{display:flex;align-items:center;gap:8px}
.lv-time{font-size:20px;font-weight:600}
.lv-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lv{border-radius:10px;background:var(--sunk);padding:10px 12px;display:grid;gap:1px;min-width:0}
.lv .k{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lv b{font-size:16px} .lv > span:last-child{font-size:13px;color:var(--muted)}
.lv.alert{background:var(--bad-soft)} .lv.alert b{color:var(--bad)}
.askbar{display:flex;gap:8px}
.askbar input{flex:1;min-width:0;min-height:46px}
.askform{display:grid;gap:10px;margin-top:10px}
.askform textarea{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:72px;resize:vertical;width:100%}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sg{font:500 13.5px var(--body);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.sg:hover{border-color:var(--muted)}
.thread{display:grid;gap:12px}
.msg{max-width:92%;border-radius:14px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.msg.me{justify-self:end;background:var(--ink);color:var(--panel);border-bottom-right-radius:4px}
.msg.bot{justify-self:start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.ans{display:grid;gap:6px;font-size:15.5px}
.ans ul{padding-left:18px;display:grid;gap:4px}
.ans .mh{font-weight:700}
.src{font:500 11.5px var(--mono);color:var(--muted)}
/* remedies */
.rplan{display:grid;gap:8px}
.rcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rcard[open]{border-color:var(--muted)}
.rcard > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:12px;align-items:center}
.rcard > summary::-webkit-details-marker{display:none}
.rk{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 12px var(--mono)}
.rn{display:grid;min-width:0} .rn b{font-size:16px} .rn > span{font-size:13.5px;color:var(--muted)}
.rcard .tags{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}
.rbody{padding:0 12px 14px 50px;display:grid;gap:8px}
.rbody dl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 10px;margin:0;font-size:14.5px}
.rbody dt{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.rbody dd{margin:0} .rbody ul{padding-left:18px;display:grid;gap:2px}
.ev.hl .t b{color:var(--accent)}
.ev .t span + b{margin-top:6px}
/* sadhana */
.ck-row{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:start}
.ck-dot{width:14px;height:14px;border-radius:50%;background:var(--ck);margin-top:6px;box-shadow:0 0 0 4px var(--sunk)}
.chak-today{border-top:4px solid var(--ck)}
.cmap{display:grid;gap:0}
.crow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow.today{background:var(--sunk);border-radius:10px;padding:10px;margin:2px -10px;border-bottom-color:transparent}
.crow .ck-dot{margin-top:0}
.cn{display:grid;min-width:0} .cn b{font-size:15.5px} .cn span{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.cd{grid-column:2/-1;font-size:14px;color:var(--muted)}
.mala{display:block;margin:4px auto 12px;width:200px;max-width:100%;aspect-ratio:1;position:relative;border:0;background:none;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:0}
.mala svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.mr-bg{fill:var(--sunk);stroke:var(--line);stroke-width:8}
.mr-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .15s}
.mala .mc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.mala .mc b{font:600 44px/1 var(--mono);color:var(--ink)} .mala .mc span{font-size:13px;color:var(--muted)}
.mala:active .mr-bg{fill:var(--line)}
.breath{display:grid;justify-items:center;gap:6px;padding:16px 0 8px}
.orb{width:150px;height:150px;border-radius:50%;background:var(--good-soft);border:2px solid var(--good);transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out}
.orb.on.in{transform:scale(1)} .orb.on.out{transform:scale(.55)}
.bcue{font:600 16px var(--body);text-align:center;min-height:24px}
.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:3px;max-width:340px}
.hc{display:block;aspect-ratio:1;border-radius:3px;background:var(--good);min-width:10px}
.hc.l0{background:var(--sunk)} .hc.l1{opacity:.3} .hc.l2{opacity:.5} .hc.l3{opacity:.75} .hc.l4{opacity:1} .hc.lx{background:transparent;border:1px dashed var(--line)}
.legend .hc{width:12px;height:12px;min-width:0}
.jform{display:grid;gap:12px}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.rate{display:grid;gap:4px} .rate > span{font-size:13.5px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:6px}
.dots button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:600 13px var(--mono);cursor:pointer;color:var(--muted)}
.dots button.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
@media (prefers-reduced-motion:reduce){.orb{transition:none!important}}
@media (prefers-reduced-motion:reduce){.lv-dot{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  var ABODY = { Ma: 'Mars', Me: 'Mercury', Ju: 'Jupiter', Ve: 'Venus', Sa: 'Saturn' };

  function tropical(code, date) {
    if (code === 'Su') return A.SunPosition(date).elon;
    if (code === 'Mo') return A.EclipticGeoMoon(date).lon;
    if (code === 'Ra' || code === 'Ke') {

  }
  function sidereal(code, date) { return norm(tropical(code, date) - ayanamsa(date)); }

  function speed(code, date) {
    if (code === 'Ra' || code === 'Ke') return -0.053;

    var d = b - a; if (d > 180) d -= 360; if (d < -180) d += 360; return d;
  }

  function lagna(date, lat, lon) {
    var t = T(date);
    var eps = (23.4392911 - 0.0130042 * t) * RAD;
    var theta = norm(A.SiderealTime(date) * 15 + lon) * RAD;
    var phi = lat * RAD;
    var asc = Math.atan2(Math.cos(theta), -(Math.sin(theta) * Math.cos(eps) + Math.tan(phi) * Math.sin(eps))) * DEG;

  }

  /* Placidus cusps (KP houses), sidereal; returns 12 cusp longitudes, index 0 = house 1 */
  function placidus(date, lat, lon) {

    var ramc = norm(A.SiderealTime(date) * 15 + lon);
    function lamFromRA(ra) { var r = ra * RAD; return norm(Math.atan2(Math.sin(r), Math.cos(r) * Math.cos(eps)) * DEG); }

    var c2 = cusp(function (a) { return ramc + 180 - 2 * (90 - a) / 3; }, ramc + 120);

  var SIGNS = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];
  var SIGNS_HI = ['Mesha', 'Vrishabha', 'Mithuna', 'Karka', 'Simha', 'Kanya', 'Tula', 'Vrishchika', 'Dhanu', 'Makara', 'Kumbha', 'Meena'];
  var NAKS = ['Ashwini', 'Bharani', 'Krittika', 'Rohini', 'Mrigashira', 'Ardra', 'Punarvasu', 'Pushya', 'Ashlesha', 'Magha', 'Purva Phalguni', 'Uttara Phalguni', 'Hasta', 'Chitra', 'Swati', 'Vishakha', 'Anuradha', 'Jyeshtha', 'Moola', 'Purva Ashadha', 'Uttara Ashadha', 'Shravana', 'Dhanishta', 'Shatabhisha', 'Purva Bhadrapada', 'Uttara Bhadrapada', 'Revati'];
  var DASHA_ORDER = ['Ke', 'Ve', 'Su', 'Mo', 'Ma', 'Ra', 'Ju', 'Sa', 'Me'];
  var DASHA_YEARS = { Ke: 7, Ve: 20, Su: 6, Mo: 10, Ma: 7, Ra: 18, Ju: 16, Sa: 19, Me: 17 };
  var PNAME = { Su: 'Sun', Mo: 'Moon', Ma: 'Mars', Me: 'Mercury', Ju: 'Jupiter', Ve: 'Venus', Sa: 'Saturn', Ra: 'Rahu', Ke: 'Ketu' };
  var NAK = 40 / 3, YEAR = 365.25 * DAY;

  function nakInfo(lon) {
    var i = Math.floor(lon / NAK), within = lon - i * NAK;
    var lord = DASHA_ORDER[i % 9];
    /* KP sub lord: nakshatra split in proportion to dasha years, starting from the star lord */
    var acc = 0, start = DASHA_ORDER.indexOf(lord), sub = lord;
    for (var k = 0; k < 9; k++) {

  }
  function signOf(lon) { return Math.floor(lon / 30); }
  function dms(lon) {
    var d = lon % 30, deg = Math.floor(d), m = Math.floor((d - deg) * 60);

  function chart(date, lat, lon) {

  /* Vimshottari: three levels (maha, antar, pratyantar) */

    var list = [];
    for (var k = 0; k < 18; k++) {
      var lord = DASHA_ORDER[(startIdx + k) % 9], len = DASHA_YEARS[lord] * YEAR;

  }
  function subPeriods(p) {

  }
  function find(list, date) { for (var i = 0; i < list.length; i++) if (date >= list[i].start && date < list[i].end) return list[i]; return null; }

  /* Panchang */
  var TITHIS = ['Pratipada', 'Dwitiya', 'Tritiya', 'Chaturthi', 'Panchami', 'Shashthi', 'Saptami', 'Ashtami', 'Navami', 'Dashami', 'Ekadashi', 'Dwadashi', 'Trayodashi', 'Chaturdashi'];
  var YOGAS = ['Vishkumbha', 'Priti', 'Ayushman', 'Saubhagya', 'Shobhana', 'Atiganda', 'Sukarma', 'Dhriti', 'Shoola', 'Ganda', 'Vriddhi', 'Dhruva', 'Vyaghata', 'Harshana', 'Vajra', 'Siddhi', 'Vyatipata', 'Variyan', 'Parigha', 'Shiva', 'Siddha', 'Sadhya', 'Shubha', 'Shukla', 'Brahma', 'Indra', 'Vaidhriti'];
  var KARANA_MOVE = ['Bava', 'Balava', 'Kaulava', 'Taitila', 'Garaja', 'Vanija', 'Vishti'];
  var VARAS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var VARA_LORD = ['Su', 'Mo', 'Ma', 'Me', 'Ju', 'Ve', 'Sa'];

  /* when does f(t) (a 0..360 angle) next reach `target`?  search forward up to `hours` */

    var ti = tithiOf(rise), yo = yogaOf(rise);
    var nakEnd = nextCrossing(function (d) { return sidereal('Mo', d); }, rise, (nk.index + 1) * NAK % 360, 36);

      rise: rise, set: set, nextRise: nextRise,
      moonLon: moonL, moonSign: signOf(moonL), nak: nk, nakEnd: nakEnd,

  /* Sign ingresses and retrograde / direct stations between two dates */

}

      [['Work', work], ['Health', health], ['Mind', mind], ['Practice', practice]].filter(function(x){ return x[1].length; }).map(function(x){ return '<div class="fo"><span class="k">' + x[0] + '</span><ul>' + x[1].map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>'; }).join('') +

    var rows = [];

  var ROUTINE = [

  /* =========================================================

  function weekStart(ymd){ var wd = weekday(ymd); return addYMD(ymd, wd === 0 ? -6 : 1 - wd); }

        return '<button type="button" class="wrow' + (D.ymd === sel ? ' sel' : '') + '" data-day="' + D.ymd + '"><span class="dd"><span>' + WD3[D.wd] + '</span><b>' + Number(D.ymd.slice(8)) + '</b>' + (D.ymd === nowY ? '<span style="color:var(--accent)">today</span>' : '') + '</span>' +

          '<span class="tag ' + s.v + '">' + VSHORT[s.v] + '</span></button>';

      '<div class="pl-card"><span class="k">Keep light</span><b>' + (light.length ? esc(light.join(', ')) : 'None') + '</b><span>Chandrashtama days</span></div>' +

      '<section class="panel" aria-labelledby="ml"><div class="ph"><h2 id="ml">Keep light</h2></div><div class="evlist">' +

  /* =========================================================

  function viewYear(){

      for (var i = 0; i < Math.min(dayN, sk.days); i++) { var en = JR.days[addYMD(sk.start, i)]; if (en && en.sank) kept++; }
      var pct = Math.min(100, kept / sk.days * 100);
      skHTML = '<p class="lead"><b>' + esc(sk.title) + '</b></p><p class="muted small">Started ' + dmYMD(sk.start) + ' · day ' + Math.min(dayN, sk.days) + ' of ' + sk.days + ' · kept ' + kept + '</p><div class="progress" style="margin-top:8px"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
        '<div class="actions" style="margin-top:10px"><label class="item" for="sank-today" style="border:0;padding:0"><input type="checkbox" id="sank-today"' + (e.sank ? ' checked' : '') + '><span>Kept it today</span></label><button type="button" class="btn ghost" id="sank-end">' + (dayN > sk.days ? 'Close and start a new one' : 'End sankalpa') + '</button></div>';
    } else {
      var sug = MANTRA[remedyPlan(new Date())[0].code];
      skHTML = '<p class="muted small">A sankalpa is one practice kept daily for 40 days (a mandala). Suggested from your plan: 108× ' + esc(sug) + '.</p><form id="sank-form" class="askbar" style="margin-top:10px"><label class="sr" for="sank-title">Sankalpa</label><input type="text" id="sank-title" value="108× ' + esc(sug) + '"><button type="submit" class="btn">Start 40 days</button></form>';
    }
    h += '<section class="panel" aria-labelledby="sd5"><div class="ph"><h2 id="sd5">Sankalpa</h2><span class="eyebrow">40-day mandala</span></div>' + skHTML + '</section>';

    /* journal */
    function rate(id, label, v){ return '<div class="rate"><span>' + label + '</span><div class="dots" role="radiogroup" aria-label="' + label + '">' + [1,2,3,4,5].map(function(n){ return '<button type="button" role="radio" aria-checked="' + (v === n) + '" data-rate="' + id + '" data-v="' + n + '" class="' + (v >= n ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div></div>'; }
    h += '<section class="panel" aria-labelledby="sd6"><div class="ph"><h2 id="sd6">Today’s journal</h2><span class="eyebrow">' + dmYMD(t) + '</span></div><form id="jform" class="jform">' +
      '<div class="fs"><label class="f" for="j-malas">Malas (108 each)<input type="number" min="0" step="1" id="j-malas" value="' + Math.floor((e.beads || 0) / 108) + '"></label>' +
      '<label class="f" for="j-med">Meditation, min<input type="number" min="0" step="1" id="j-med" value="' + (e.med || 0) + '"></label>' +
      '<label class="f" for="j-pran">Pranayama, min<input type="number" min="0" step="1" id="j-pran" value="' + (e.pran || 0) + '"></label></div>' +
      '<label class="chk" for="j-chakra" style="margin-top:4px"><input type="checkbox" id="j-chakra"' + (e.chakra ? ' checked' : '') + '>Did today’s ' + C.n + ' practice</label>' +
      '<div class="rates">' + rate('calm', 'Calm', e.calm) + rate('energy', 'Energy', e.energy) + rate('digest', 'Digestion', e.digest) + rate('sleep', 'Sleep', e.sleep) + '</div>' +
      '<label class="f" for="j-note">One line: insight, synchronicity or struggle<input type="text" id="j-note" maxlength="300" value="' + esc(e.note || '') + '"></label>' +
      '<div class="actions"><button type="submit" class="btn">Save today</button><span class="saved" id="j-msg" role="status">' + esc(JFLASH) + '</span></div><p class="note">' + syncLine() + '</p></form></section>';

    /* journey */
    h += '<section class="panel" aria-labelledby="sd7"><div class="ph"><h2 id="sd7">Your journey</h2><span class="eyebrow">' + js.count + ' days logged</span></div>' +
      '<div class="plan"><div class="pl-card"><span class="k">Streak</span><b>' + js.streak + ' day' + (js.streak === 1 ? '' : 's') + '</b><span>Any practice logged</span></div><div class="pl-card"><span class="k">This month</span><b>' + js.malas + ' malas</b><span>' + js.minutes + ' min of meditation and breath</span></div></div>' +
      '<div style="margin-top:14px">' + heatHTML() + '</div>' +
      (STANDALONE ? '<div class="actions" style="margin-top:14px"><button type="button" class="btn ghost" id="jr-export">Back up journal</button><label class="btn ghost" for="jr-import" style="display:inline-flex;align-items:center">Restore backup<input type="file" id="jr-import" accept="application/json,.json" class="sr"></label><span class="note" id="jr-msg"></span></div><p class="note">This saved copy keeps your journal on this phone only. Back it up now and then.</p>' : '') +
      '<h3 style="margin:16px 0 8px">What your log says about the sky</h3>' + patternsHTML() +
      '<div style="margin-top:14px">' + (sampleFn && !sampleOff ? '<button type="button" class="btn" id="reflect-btn"' + (REFLECT.busy ? ' disabled' : '') + '>' + (REFLECT.busy ? 'Reflecting…' : 'Reflect with Claude') + '</button>' : '') +
      (REFLECT.text || REFLECT.busy ? '<div class="msg bot" style="max-width:100%;margin-top:10px"><div class="ans" id="reflect-out">' + (REFLECT.text ? md(REFLECT.text) : '<p class="muted">Thinking…</p>') + '</div></div>' : '') + (REFLECT.err ? '<p class="note">' + esc(REFLECT.err) + '</p>' : '') + '</div></section>';

    /* inner-work windows */
    var now = new Date(), pds = pdList(now, new Date(now.getTime() + 1100 * DAY)).filter(function(x){ return x.pd === 'Ke' || x.pd === 'Ju'; }).slice(0, 4);
    var m12 = J.signWindows('Mo', (N.chart.ascSign + 11) % 12, now, new Date(now.getTime() + 60 * DAY), 6).slice(0, 2);
    h += '<section class="panel" aria-labelledby="sd8"><div class="ph"><h2 id="sd8">Windows for inner work</h2><span class="eyebrow">Computed</span></div><div class="evlist">' +
      m12.map(function(w){ return '<div class="ev"><span class="d">' + (w.start ? dm(w.start) : 'Now') + '</span><span class="t"><b>Moon in your 12th (' + J.SIGNS[(N.chart.ascSign + 11) % 12] + ')</b><span>Until ' + dm(w.end) + ' ' + hm(w.end) + '. The house of moksha: good for retreat, sleep and longer meditation.</span></span></div>'; }).join('') +
      pds.map(function(x){ return '<div class="ev"><span class="d">' + dmy(x.start) + '</span><span class="t"><b>' + pdName(x) + '</b><span>Until ' + dmy(x.end) + '. ' + (x.pd === 'Ke' ? 'Ketu pratyantar: naturally inward; deepen meditation and let go of what no longer fits.' : 'Jupiter pratyantar: study, a teacher’s guidance and mantra practice bear fruit.') + '</span></span></div>'; }).join('') +
      '</div></section>';
    return h;
  }

  /* =========================================================
     Settings
     ========================================================= */
  function opt(list, val){ return list.map(function(o){ return '<option value="' + o[0] + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
  function settingsHTML(){
    var dis = S.gAuto ? ' disabled' : '';
    return '<section class="panel"><details class="settings" id="settings"><summary><span><span class="eyebrow">Chart settings</span><br><b>' + esc(S.name) + '</b> <span class="muted">· ' + esc(S.bdate.split('-').reverse().join('-')) + ', ' + esc(S.btime) + ', ' + esc(S.bplace) + '</span></span></summary>' +
      '<form class="form" id="sform"><fieldset><legend>Birth details</legend><div class="fs">' +
      '<label class="f" for="s-name">Name<input type="text" id="s-name" value="' + esc(S.name) + '"></label>' +
      '<label class="f" for="s-bdate">Birth date<input type="date" id="s-bdate" value="' + esc(S.bdate) + '" required></label>' +
      '<label class="f" for="s-btime">Birth time<input type="time" id="s-btime" value="' + esc(S.btime) + '" required></label>' +
      '<label class="f" for="s-bplace">Birth place<input type="text" id="s-bplace" value="' + esc(S.bplace) + '"></label>' +
      '<label class="f" for="s-blat">Latitude (N +)<input type="number" step="0.0001" id="s-blat" value="' + S.blat + '" required></label>' +
      '<label class="f" for="s-blon">Longitude (E +)<input type="number" step="0.0001" id="s-blon" value="' + S.blon + '" required></label>' +
      '<label class="f" for="s-btz">Time zone (hours)<input type="number" step="0.25" id="s-btz" value="' + S.btz + '" required></label></div></fieldset>' +
      '<fieldset><legend>Where you are today</legend><div class="fs">' +
      '<label class="f" for="s-place">Place<input type="text" id="s-place" value="' + esc(S.place) + '"></label>' +
      '<label class="f" for="s-lat">Latitude (N +)<input type="number" step="0.0001" id="s-lat" value="' + S.lat + '" required></label>' +
      '<label class="f" for="s-lon">Longitude (E +)<input type="number" step="0.0001" id="s-lon" value="' + S.lon + '" required></label>' +
      '<label class="f" for="s-tz">Time zone (hours)<input type="number" step="0.25" id="s-tz" value="' + S.tz + '" required></label></div></fieldset>' +
      '<fieldset><legend>Ghatak</legend><div class="fs">' +
      '<label class="chk" for="s-gauto"><input type="checkbox" id="s-gauto"' + (S.gAuto ? ' checked' : '') + '>Use the standard Ghatak table for the natal Moon sign</label>' +
      '<label class="f" for="s-gvara">Day<select id="s-gvara"' + dis + '>' + opt(J.VARAS.map(function(v, i){ return [i, v]; }), S.gVara) + '</select></label>' +
      '<label class="f" for="s-gtithi">Tithi group<select id="s-gtithi"' + dis + '>' + opt(TITHI_GROUPS, S.gTithi) + '</select></label>' +
      '<label class="f" for="s-gnak">Nakshatra<select id="s-gnak"' + dis + '>' + opt(J.NAKS.map(function(v, i){ return [i, v]; }), S.gNak) + '</select></label>' +
      '<label class="f" for="s-gyoga">Yoga<select id="s-gyoga"' + dis + '>' + opt(J.YOGAS.map(function(v, i){ return [i, v]; }), S.gYoga) + '</select></label>' +
      '</div><p class="note" style="margin-top:8px">Untick to set your own values if your Ghatak table differs.</p></fieldset>' +
      '<div class="actions"><button type="submit" class="btn">Save and recalculate</button><button type="button" class="btn ghost" id="s-reset">Reset to Mehul’s chart</button><span class="saved" id="s-msg" role="status"></span></div>' +
      '</form></details></section>';
  }

  /* =========================================================
     Render + events
     ========================================================= */
  var VIEWFN = { today:viewToday, ask:viewAsk, remedies:viewRemedies, sadhana:viewSadhana, week:viewWeek, month:viewMonth, year:viewYear, chart:viewChart, guide:viewGuide };
  function render(){
    dayInput.value = sel;
    document.getElementById('who').textContent = 'for ' + S.name;
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    var label = {today:'day', ask:'day', remedies:'day', sadhana:'day', week:'week', month:'month', year:'year', chart:'day', guide:'day'}[tab];
    document.getElementById('prev').setAttribute('aria-label', 'Previous ' + label);
    document.getElementById('next').setAttribute('aria-label', 'Next ' + label);
    var foot = '<p class="foot">Sidereal positions with Lahiri ayanamsa and mean Rahu; whole-sign houses, Placidus for KP. Panchang at sunrise for ' + esc(S.place) + '. Day verdicts add up Tarabala, Chandrabala, Ghatak, yoga and karana: guidance, not certainty.</p>';
    try { app.innerHTML = VIEWFN[tab]() + foot; }
    catch (err) { app.innerHTML = '<p class="boot">Something went wrong while calculating: ' + esc(err.message) + '. Reset the chart settings or reload.</p>'; if (window.console) console.error(err); }
  }
  function step(dir){
    if (tab === 'week') sel = addYMD(sel, 7 * dir);
    else if (tab === 'month') sel = addMonths(sel, dir);
    else if (tab === 'year') sel = addMonths(sel, 12 * dir);
    else sel = addYMD(sel, dir);
    openMD = null; render();
  }
  function setTab(t){ if (BREATH.on && t !== 'sadhana') breathStop(false); tab = t; store.set('jyotish-tab', t); try { history.replaceState(null, '', '#' + t); } catch(e){} render(); window.scrollTo({top:0}); }
  dayInput.addEventListener('change', function(){ if (dayInput.value) { sel = dayInput.value; openMD = null; render(); } });
  document.getElementById('prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('next').addEventListener('click', function(){ step(1); });
  document.getElementById('today').addEventListener('click', function(){ sel = todayYMD(); openMD = null; render(); });
  document.getElementById('tabs').addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if (b) setTab(b.getAttribute('data-tab')); });
  app.addEventListener('click', function(e){
    var t;
    if ((t = e.target.closest('[data-q]'))) { ask(t.getAttribute('data-q')); return; }
    if (e.target.closest('#mala-tap')) { MALA.beads++; if (MALA.beads % 108 === 0) { try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (x) {} } var mt = document.getElementById('mala-tap'); if (mt) { mt.outerHTML = malaHTML().split('<div class="actions"')[0]; } var ml = document.getElementById('mala-log'); if (ml) ml.disabled = false; return; }
    if (e.target.id === 'mala-undo') { MALA.beads = Math.max(0, MALA.beads - 1); render(); return; }
    if (e.target.id === 'mala-reset') { MALA.beads = 0; render(); return; }
    if (e.target.id === 'mala-log') { var tt = todayYMD(), en = entryFor(tt); en.beads = (en.beads || 0) + MALA.beads; MALA.beads = 0; jrSave(tt, en); render(); return; }
    if ((t = e.target.closest('[data-bp]'))) { if (!BREATH.on) { BREATH.pat = t.getAttribute('data-bp'); render(); } return; }
    if (e.target.id === 'bstart') { if (BREATH.on) breathStop(false); else { BREATH.on = true; BREATH.phase = 0; BREATH.started = Date.now(); BREATH.endAt = Date.now() + BREATH.mins * 60000; render(); setTimeout(breathTick, 50); } return; }
    if ((t = e.target.closest('[data-rate]'))) { var rk = t.getAttribute('data-rate'), rv = +t.getAttribute('data-v'); JDRAFT[rk] = rv; document.querySelectorAll('[data-rate="' + rk + '"]').forEach(function(b){ var v = +b.getAttribute('data-v'); b.className = v <= rv ? 'on' : ''; b.setAttribute('aria-checked', String(v === rv)); }); return; }
    if (e.target.id === 'sank-end') { jrSaveSankalpa(null); render(); return; }
    if (e.target.id === 'reflect-btn') { reflect(); return; }
    if (e.target.id === 'jr-export') {
      var blob = new Blob([JSON.stringify({ app: 'jyotish-compass', saved: new Date().toISOString(), days: JR.days, sankalpa: JR.sankalpa, routine: (function(){ var r = {}; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf('jyotish-routine-') === 0) r[k] = JSON.parse(localStorage.getItem(k)); } } catch (x) {} return r; })() }, null, 1)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jyotish-journal-' + todayYMD() + '.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      var jm = document.getElementById('jr-msg'); if (jm) jm.textContent = 'Backup saved to your downloads.'; return;
    }
    if (e.target.id === 'askstop') { if (askCtl) askCtl.abort(); return; }
    if (e.target.id === 'ask-clear') { chat = []; saveChat(); render(); return; }
    if ((t = e.target.closest('[data-day]'))) { sel = t.getAttribute('data-day'); setTab('today'); return; }
    if ((t = e.target.closest('[data-month]'))) { sel = t.getAttribute('data-month'); setTab('month'); return; }
    if ((t = e.target.closest('[data-go]'))) { setTab(t.getAttribute('data-go')); return; }
    if ((t = e.target.closest('[data-h]'))) { horaMode = t.getAttribute('data-h'); render(); return; }
    if ((t = e.target.closest('[data-c]'))) { chartMode = t.getAttribute('data-c'); render(); return; }
    if ((t = e.target.closest('[data-md]'))) { var i = +t.getAttribute('data-md'); openMD = (t.getAttribute('aria-expanded') === 'true') ? -1 : i; render(); return; }
    if (e.target.id === 's-reset') { S = JSON.parse(JSON.stringify(DEFAULTS)); store.set('jyotish-settings', S); fullCache = {}; liteCache = {}; computeNatal(); sel = todayYMD(); render(); openSettings('Reset to Mehul’s chart.'); }
  });
  app.addEventListener('change', function(e){
    var rmk = e.target.getAttribute && e.target.getAttribute('data-rem');
    if (rmk) { var ty = todayYMD(), ent = entryFor(ty); ent.rem = ent.rem || {}; ent.rem[rmk] = e.target.checked; jrSave(ty, ent); return; }
    if (e.target.id === 'sank-today') { var ty2 = todayYMD(), en2 = entryFor(ty2); en2.sank = e.target.checked; jrSave(ty2, en2); return; }
    if (e.target.id === 'bmins') { BREATH.mins = +e.target.value; return; }
    if (e.target.id === 'jr-import' && e.target.files && e.target.files[0]) {
      var fr = new FileReader();
      fr.onload = function(){ try { var j = JSON.parse(fr.result); if (!j || typeof j.days !== 'object') throw new Error('not a journal backup');
        Object.keys(j.days).forEach(function(k){ if (/^\d{4}-\d{2}-\d{2}$/.test(k) && !JR.days[k]) JR.days[k] = j.days[k]; });
        if (!JR.sankalpa && j.sankalpa && j.sankalpa.title) JR.sankalpa = j.sankalpa;
        if (j.routine) Object.keys(j.routine).forEach(function(k){ if (k.indexOf('jyotish-routine-') === 0) store.set(k, j.routine[k]); });
        jrLocal(); render(); var jm = document.getElementById('jr-msg'); if (jm) jm.textContent = 'Restored ' + Object.keys(j.days).length + ' days.';
      } catch (x) { var jm2 = document.getElementById('jr-msg'); if (jm2) jm2.textContent = 'That file isn\u2019t a journal backup from this app.'; } };
      fr.readAsText(e.target.files[0]); return;
    }
    if (e.target.id === 's-gauto') { ['s-gvara','s-gtithi','s-gnak','s-gyoga'].forEach(function(id){ document.getElementById(id).disabled = e.target.checked; }); return; }
    var r = e.target.getAttribute && e.target.getAttribute('data-r');
    if (r) {
      var box = document.getElementById('routine'), key = box.getAttribute('data-key'), done = store.get(key) || {};
      done[r] = e.target.checked; store.set(key, done);
      var n = ROUTINE.filter(function(x){ return done[x[0]]; }).length;
      document.getElementById('rt-count').textContent = n + ' of ' + ROUTINE.length;
      document.getElementById('rt-bar').style.width = (n / ROUTINE.length * 100) + '%';
    }
  });
  app.addEventListener('submit', function(e){
    if (e.target.id === 'jform') {
      e.preventDefault(); var ty = todayYMD(), en = entryFor(ty), num = function(id){ var v = parseInt(document.getElementById(id).value, 10); return isFinite(v) && v > 0 ? v : 0; };
      en.beads = num('j-malas') * 108 + ((en.beads || 0) % 108); en.med = num('j-med'); en.pran = num('j-pran'); en.chakra = document.getElementById('j-chakra').checked;
      en.note = document.getElementById('j-note').value.slice(0, 300); ['calm','energy','digest','sleep'].forEach(function(k){ if (JDRAFT[k]) en[k] = JDRAFT[k]; });
      var msg = document.getElementById('j-msg'); if (msg) msg.textContent = 'Saving…';
      jrSave(ty, en).then(function(){ JDRAFT = {}; JFLASH = JR.err ? 'Saved on this device' : 'Saved'; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); render(); setTimeout(function(){ JFLASH = ''; var m2 = document.getElementById('j-msg'); if (m2) m2.textContent = ''; }, 4000); });
      return;
    }
    if (e.target.id === 'sank-form') { e.preventDefault(); var ttl = document.getElementById('sank-title').value.trim(); if (ttl) { jrSaveSankalpa({ title: ttl.slice(0, 120), start: todayYMD(), days: 40 }); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); render(); } return; }
    if (e.target.id === 'askform') { e.preventDefault(); var qa = document.getElementById('askq'); var qv = qa.value; qa.value = ''; ask(qv); return; }
    if (e.target.id === 'askbar') { e.preventDefault(); var qb = document.getElementById('askbar-q').value; ask(qb); return; }
    if (e.target.id !== 'sform') return;
    e.preventDefault();
    function v(id){ return document.getElementById(id).value; }
    var n = { name: v('s-name').trim() || 'Me', bdate: v('s-bdate'), btime: v('s-btime'), bplace: v('s-bplace').trim() || '–',
      blat: parseFloat(v('s-blat')), blon: parseFloat(v('s-blon')), btz: parseFloat(v('s-btz')),
      place: v('s-place').trim() || '–', lat: parseFloat(v('s-lat')), lon: parseFloat(v('s-lon')), tz: parseFloat(v('s-tz')),
      gAuto: document.getElementById('s-gauto').checked, gVara: +v('s-gvara'), gTithi: v('s-gtithi'), gNak: +v('s-gnak'), gYoga: +v('s-gyoga') };
    var bad = [n.blat, n.blon, n.btz, n.lat, n.lon, n.tz].some(function(x){ return !isFinite(x); }) || Math.abs(n.blat) > 66 || Math.abs(n.lat) > 66 || !n.bdate || !n.btime;
    var msg = document.getElementById('s-msg');
    if (bad) { msg.textContent = 'Check the date, time and coordinates (latitude between −66 and 66).'; msg.style.color = 'var(--bad)'; return; }
    S = n; store.set('jyotish-settings', S); fullCache = {}; liteCache = {};
    computeNatal(); render(); openSettings('Saved. Everything is recalculated.');
  });
  app.addEventListener('keydown', function(e){ if (e.target.id === 'askq' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); var qa = e.target, qv = qa.value; qa.value = ''; ask(qv); } });
  /* live refresh: every 30 s update the live card; roll the day over at local midnight */
  var lastToday = todayYMD();
  setInterval(function(){
    var nt = todayYMD();
    if (nt !== lastToday) { if (sel === lastToday) sel = nt; lastToday = nt; if (!pending) render(); return; }
    var lv = document.getElementById('live'); if (lv) { try { lv.innerHTML = liveInner(); } catch (err) {} }
  }, 30000);
  function openSettings(msg){ var d = document.getElementById('settings'); if (d) { d.open = true; var m = document.getElementById('s-msg'); if (m) m.textContent = msg; } }

  try { computeNatal(); render(); }
  catch (err) { app.innerHTML = '<p class="boot">Something went wrong while calculating: ' + esc(err.message) + '. Reload the page.</p>'; if (window.console) console.error(err); }
})();

</script>
